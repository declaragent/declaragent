name: Dependency scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly 06:00 UTC — picks up new CVEs published since the last PR.
    - cron: "0 6 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  osv-scanner:
    name: OSV scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .osv-ignore expiries
        run: |
          python3 - <<'PY'
          import datetime
          import sys
          import pathlib

          # Config is TOML because that's what osv-scanner consumes.
          # Python 3.11+ ships tomllib; this runs on ubuntu-latest which
          # has 3.12+, so no extra install step.
          path = pathlib.Path('.osv-ignore.toml')
          if not path.exists():
              sys.exit(0)

          import tomllib

          data = tomllib.loads(path.read_text())
          today = datetime.date.today()
          failed = []
          entries = data.get('IgnoredVulns', [])
          for entry in entries:
              eid = entry.get('id', '<missing id>')
              expires_raw = entry.get('expires')
              reason = entry.get('reason')
              if not expires_raw:
                  failed.append(f"{eid}: missing `expires` (required)")
                  continue
              if not reason:
                  failed.append(f"{eid}: missing `reason` (required)")
                  continue
              # TOML dates parse as datetime.date; strings still need coercing.
              if isinstance(expires_raw, datetime.date):
                  expires = expires_raw
              else:
                  try:
                      expires = datetime.date.fromisoformat(str(expires_raw))
                  except ValueError:
                      failed.append(f"{eid}: `expires` must be YYYY-MM-DD, got {expires_raw!r}")
                      continue
              if expires < today:
                  failed.append(
                      f"{eid}: expired on {expires} — remediate or renew the ignore with a new expiry"
                  )
          if failed:
              for line in failed:
                  print(f"::error::osv-ignore: {line}")
              sys.exit(1)
          print(f"::notice::osv-ignore ok ({len(entries)} entries)")
          PY

      - name: Install osv-scanner
        run: |
          curl -sL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner

      - name: Scan lockfile + manifests
        run: |
          osv-scanner \
            --lockfile=bun.lock \
            --config=.osv-ignore.toml \
            --format=sarif \
            --output=osv-results.sarif \
            . || true
          # Exit 1 on any advisory match (osv-scanner's default
          # behaviour). The `--max-severity` flag was removed upstream;
          # the ignore list (enforced with expiry above) is how we ack
          # known-non-critical findings.
          osv-scanner \
            --lockfile=bun.lock \
            --config=.osv-ignore.toml \
            .

      - name: Upload SARIF to code-scanning
        if: always() && hashFiles('osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner
