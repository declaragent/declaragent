name: npm audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"

jobs:
  audit:
    name: bun pm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit (fail on high + critical)
        run: bun pm audit --audit-level=high

      - name: Full report (non-blocking)
        if: always()
        run: bun pm audit || true
