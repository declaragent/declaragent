name: npm audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"

jobs:
  audit:
    name: bun pm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bun does not currently ship a native `bun pm audit` command —
      # the workflow originally targeted one. `bun pm scan` exists but
      # requires a configured third-party scanner (e.g. Snyk), which
      # we haven't wired up yet.
      #
      # Until then, run `npm audit` against a generated package-lock as
      # a pragmatic fallback. This is non-blocking for now — once we
      # either wire a Bun scanner or move the blocking check into
      # deps-scan.yml's OSV job, flip the step back to blocking.
      - name: Audit via npm fallback (non-blocking)
        run: |
          # Generate a package-lock.json for npm audit without running installs.
          npm install --package-lock-only --ignore-scripts --no-audit > /dev/null 2>&1 || true
          npm audit --audit-level=high || echo "::warning::npm audit reported high/critical findings — triage before merge"
