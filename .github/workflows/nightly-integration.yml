name: nightly — fleet RPC over Kafka + NATS

# Slice 7 of RELEASE_0_6_0_PLAN + Item #2 of ENTERPRISE_PRODUCTION_PLAN.
# Exercises the Kafka and NATS RPC transports end-to-end through live
# brokers (Redpanda + nats-server). Gated behind FLEET_INTEGRATION=1 /
# NATS_INTEGRATION=1 so it only runs on this workflow's schedule, not
# on every PR (the broker startup costs ~15s per broker and flake risk
# isn't worth paying per-PR).
#
# Exit criterion for 0.6.0 promotion beta → rc: 7 consecutive green
# nightlies. Failures file a GitHub issue so oncall sees the regression;
# they do NOT block unrelated PRs.

on:
  schedule:
    # 08:00 UTC daily — early in the US morning, gives the team a fresh
    # signal before real work starts. Adjust if the runner pool is
    # congested at this hour.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      retries:
        description: 'Override retry count for flake investigation'
        required: false
        default: '3'

concurrency:
  group: nightly-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fleet-rpc-kafka:
    name: fleet RPC round-trip (Kafka)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build core + plugin-agent-rpc
        run: |
          bun run --filter '@declaragent/core' build
          bun run --filter '@declaragent/plugin-agent-rpc' build

      - name: Start Redpanda broker
        run: |
          set -euo pipefail
          docker compose -f packages/source-kafka/test/fixtures/docker-compose.yml up -d
          echo "Waiting for Redpanda to go healthy..."
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' declaragent-kafka-redpanda 2>/dev/null || echo 'missing')"
            echo "  attempt $i: $status"
            [ "${status}" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' declaragent-kafka-redpanda | grep -q healthy

      - name: Run fleet RPC integration tests
        env:
          FLEET_INTEGRATION: '1'
          KAFKA_BROKERS: localhost:19092
          # 0.8.0 strict-mode window (RELEASE_0_8_0_PLAN.md §3): rehearse the
          # zero-trust default flip nightly. Any fleet-run-booted fleet in the
          # suite fails fast if a peer-using agent lacks an explicit
          # rpc.auth.enabled value.
          DECLARAGENT_RPC_AUTH_DEFAULT: 'on'
        run: |
          set -euo pipefail
          RETRIES="${{ github.event.inputs.retries || '3' }}"
          attempt=1
          while [ "${attempt}" -le "${RETRIES}" ]; do
            echo "=== attempt ${attempt}/${RETRIES} ==="
            if bun test packages/testkit/src/fleet-integration/; then
              echo "integration test passed on attempt ${attempt}"
              exit 0
            fi
            attempt=$((attempt + 1))
          done
          echo "integration test failed after ${RETRIES} attempts"
          exit 1

      - name: Dump broker logs on failure
        if: failure()
        run: |
          docker logs declaragent-kafka-redpanda --tail 200 || true
          docker ps -a || true

      - name: Stop Redpanda
        if: always()
        run: |
          docker compose -f packages/source-kafka/test/fixtures/docker-compose.yml down --volumes || true

  fleet-rpc-nats:
    name: fleet RPC round-trip (NATS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build core + plugin-agent-rpc
        run: |
          bun run --filter '@declaragent/core' build
          bun run --filter '@declaragent/plugin-agent-rpc' build

      - name: Start NATS broker
        run: |
          set -euo pipefail
          docker compose -f packages/source-nats/test/fixtures/docker-compose.yml up -d
          echo "Waiting for NATS to go healthy..."
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' declaragent-nats-server 2>/dev/null || echo 'missing')"
            echo "  attempt $i: $status"
            [ "${status}" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' declaragent-nats-server | grep -q healthy

      - name: Run fleet RPC NATS integration tests
        env:
          NATS_INTEGRATION: '1'
          NATS_SERVERS: nats://localhost:4222
          # 0.8.0 strict-mode window — same rehearsal as the Kafka lane.
          DECLARAGENT_RPC_AUTH_DEFAULT: 'on'
        run: |
          set -euo pipefail
          RETRIES="${{ github.event.inputs.retries || '3' }}"
          attempt=1
          while [ "${attempt}" -le "${RETRIES}" ]; do
            echo "=== attempt ${attempt}/${RETRIES} ==="
            if bun test packages/testkit/src/fleet-integration/nats-rpc.test.ts; then
              echo "integration test passed on attempt ${attempt}"
              exit 0
            fi
            attempt=$((attempt + 1))
          done
          echo "integration test failed after ${RETRIES} attempts"
          exit 1

      - name: Dump broker logs on failure
        if: failure()
        run: |
          docker logs declaragent-nats-server --tail 200 || true
          docker ps -a || true

      - name: Stop NATS
        if: always()
        run: |
          docker compose -f packages/source-nats/test/fixtures/docker-compose.yml down --volumes || true

  # Write a machine-readable STATUS.json on every scheduled run (green or
  # red). This is the live CI signal docs/STATUS.md and the site read,
  # replacing hardcoded status copy (PROD_PARITY_ACTIONS.md P1-11).
  publish-status:
    name: Publish STATUS.json
    needs: [fleet-rpc-kafka, fleet-rpc-nats]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const kafka = ${{ toJSON(needs.fleet-rpc-kafka.result) }};
            const nats = ${{ toJSON(needs.fleet-rpc-nats.result) }};
            const status = (kafka === 'success' && nats === 'success') ? 'passed' : 'failed';
            const payload = {
              workflow: 'nightly-integration',
              status,
              conclusion: { 'fleet-rpc-kafka': kafka, 'fleet-rpc-nats': nats },
              timestamp: new Date().toISOString(),
              commit: context.sha,
              run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            };
            fs.writeFileSync('STATUS.json', `${JSON.stringify(payload, null, 2)}\n`);
            core.summary.addRaw(`nightly-integration: **${status}**`).write();

      - name: Upload STATUS.json
        uses: actions/upload-artifact@v4
        with:
          name: status-json-${{ github.run_id }}
          path: STATUS.json
          if-no-files-found: error

  # Consolidate failures into ONE rolling tracker issue (find-or-create by
  # a fixed label), one comment per failure — not one issue per night.
  # PRs don't block here; the green-before-merge policy lives in
  # CONTRIBUTING.md ("CI status & green-before-merge").
  report-failure:
    name: Update rolling failure tracker
    needs: [fleet-rpc-kafka, fleet-rpc-nats]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const TRACKER_LABEL = 'ci-tracker:nightly-integration';
            const TRACKER_TITLE = '[nightly-integration] rolling failure tracker';
            const kafka = ${{ toJSON(needs.fleet-rpc-kafka.result) }};
            const nats = ${{ toJSON(needs.fleet-rpc-nats.result) }};
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            // Find-or-create the single rolling tracker issue by fixed label.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: TRACKER_LABEL,
              state: 'open',
              per_page: 1,
            });
            let issueNumber = existing.data[0]?.number;
            if (!issueNumber) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TRACKER_TITLE,
                body: [
                  `Rolling tracker for **nightly-integration** failures.`,
                  ``,
                  `One comment per failure is appended below. Do not close on a single green;`,
                  `close only when the underlying flake/regression is resolved.`,
                  ``,
                  `Triage each comment by adding a quarantine label:`,
                  `\`quarantine:flake\` (transient, set a deadline) or`,
                  `\`quarantine:signal\` (real regression — blocks merges). See CONTRIBUTING.md.`,
                ].join('\n'),
                labels: [TRACKER_LABEL, 'nightly-flake', 'slice-7'],
              });
              issueNumber = created.data.number;
            }

            // Always append one comment per failure.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `### Failure — ${new Date().toISOString()}`,
                ``,
                `- **Commit:** ${context.sha}`,
                `- **Run:** ${runUrl}`,
                `- **fleet-rpc-kafka:** ${kafka}`,
                `- **fleet-rpc-nats:** ${nats}`,
                ``,
                `flake-vs-signal: TBD — set \`quarantine:flake\` or \`quarantine:signal\`.`,
              ].join('\n'),
            });
