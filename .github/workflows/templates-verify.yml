name: Templates verify

# Phase 7 slice 5. Gate for the five starter template packs under
# `templates/`. Runs the shared verifier script which:
#   1. Parses every `*.yaml` / `*.yml` / `*.json` under each template.
#   2. Asserts every skill referenced in `agent.yaml` exists on disk.
#   3. Cross-checks `.env.example` against `${env:FOO}` refs in the YAML.
#
# One regression in any template fails the gate, so broken templates
# never ship to users through `declaragent init`.

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'scripts/verify-templates.ts'
      - '.github/workflows/templates-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'templates/**'
      - 'scripts/verify-templates.ts'
      - '.github/workflows/templates-verify.yml'
  workflow_dispatch:

concurrency:
  group: templates-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify template packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verify-templates
        run: bun run scripts/verify-templates.ts
