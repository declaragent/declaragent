name: weekly — Kafka fleet soak (24h)

# Enterprise Production Plan item #1 · Acceptance #2:
#   "A new packages/testkit/src/fleet-integration/kafka-soak.test.ts
#    runs ≥ 24h in CI weekly with zero dropped envelopes and p99 ≤ 3s
#    RTT."
#
# Boots Redpanda + the two-process harness and runs the soak test at
# 1 req/s for a full 24 hours. Any drift (dropped envelope, p99 > 2×
# baseline, worker crash) fails the job and files a tracking issue.
#
# Separate from `nightly-integration.yml` because:
#   1. The 24h window dwarfs the 20-minute nightly budget.
#   2. The nightly is the credential signal the release gate consumes.
#      Keeping the soak on its own track means a weekly flake doesn't
#      silently slip into "7 green nightlies" math.

on:
  schedule:
    # Sunday 00:00 UTC — finishes by Monday 00:00 UTC, keeps weekday
    # runner pools free. Adjust if the runner queue is saturated on
    # weekends.
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      duration-ms:
        description: 'Override soak duration in milliseconds'
        required: false
        default: '86400000'
      rate-hz:
        description: 'Per-second request rate'
        required: false
        default: '1'

concurrency:
  group: weekly-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kafka-soak:
    name: Kafka 24h soak
    runs-on: ubuntu-latest
    # 26h wall-clock: 24h soak + generous margin for broker boot,
    # warm-up, and post-test teardown / log upload.
    timeout-minutes: 1560
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build core + plugin-agent-rpc + testkit
        run: |
          bun run --filter '@declaragent/core' build
          bun run --filter '@declaragent/plugin-agent-rpc' build
          bun run --filter '@declaragent/testkit' build

      - name: Start Redpanda broker
        run: |
          set -euo pipefail
          docker compose -f packages/source-kafka/test/fixtures/docker-compose.yml up -d
          echo "Waiting for Redpanda to go healthy..."
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' declaragent-kafka-redpanda 2>/dev/null || echo 'missing')"
            echo "  attempt $i: $status"
            [ "${status}" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' declaragent-kafka-redpanda | grep -q healthy

      - name: Run 24h Kafka soak
        env:
          KAFKA_SOAK: '1'
          # 0.8.0 strict-mode window (RELEASE_0_8_0_PLAN.md §3): the soak
          # fleet declares rpc.auth + hmac peers; the driver signs and the
          # workers verify fail-closed — the 24h run measures the SIGNED path.
          DECLARAGENT_RPC_AUTH_DEFAULT: 'on'
          KAFKA_BROKERS: localhost:19092
          KAFKA_SOAK_DURATION_MS: ${{ github.event.inputs.duration-ms || '86400000' }}
          KAFKA_SOAK_RATE_HZ: ${{ github.event.inputs.rate-hz || '1' }}
          KAFKA_SOAK_BASELINE_MS: '300000'
        run: |
          set -euo pipefail
          # Bun test's default per-test timeout is 5s. The soak test
          # passes an explicit timeout at registration time; no need to
          # override here.
          bun test packages/testkit/src/fleet-integration/kafka-soak.test.ts

      - name: Dump broker logs on failure
        if: failure()
        run: |
          docker logs declaragent-kafka-redpanda --tail 500 || true
          docker ps -a || true

      - name: Upload broker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redpanda-logs-${{ github.run_id }}
          path: |
            /tmp/redpanda-*.log
          if-no-files-found: ignore

      - name: Stop Redpanda
        if: always()
        run: |
          docker compose -f packages/source-kafka/test/fixtures/docker-compose.yml down --volumes || true

  # Write a machine-readable STATUS.json on every scheduled run (green or
  # red). This is the live CI signal docs/STATUS.md and the site read,
  # replacing hardcoded status copy (PROD_PARITY_ACTIONS.md P1-11).
  publish-status:
    name: Publish STATUS.json
    needs: kafka-soak
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const soak = ${{ toJSON(needs.kafka-soak.result) }};
            const status = soak === 'success' ? 'passed' : 'failed';
            const payload = {
              workflow: 'weekly-soak',
              status,
              conclusion: { 'kafka-soak': soak },
              timestamp: new Date().toISOString(),
              commit: context.sha,
              run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            };
            fs.writeFileSync('STATUS.json', `${JSON.stringify(payload, null, 2)}\n`);
            core.summary.addRaw(`weekly-soak: **${status}**`).write();

      - name: Upload STATUS.json
        uses: actions/upload-artifact@v4
        with:
          name: status-json-${{ github.run_id }}
          path: STATUS.json
          if-no-files-found: error

  # Consolidate failures into ONE rolling tracker issue (find-or-create by
  # a fixed label), one comment per failure — not one issue per week.
  # Green-before-merge policy lives in CONTRIBUTING.md.
  report-failure:
    name: Update rolling failure tracker
    needs: kafka-soak
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const TRACKER_LABEL = 'ci-tracker:weekly-soak';
            const TRACKER_TITLE = '[weekly-soak] rolling failure tracker';
            const soak = ${{ toJSON(needs.kafka-soak.result) }};
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            // Find-or-create the single rolling tracker issue by fixed label.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: TRACKER_LABEL,
              state: 'open',
              per_page: 1,
            });
            let issueNumber = existing.data[0]?.number;
            if (!issueNumber) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TRACKER_TITLE,
                body: [
                  `Rolling tracker for **weekly Kafka soak** failures.`,
                  ``,
                  `One comment per failure is appended below. Do not close on a single green;`,
                  `close only when the underlying flake/regression is resolved.`,
                  ``,
                  `Soak checks: zero dropped envelopes, p99 ≤ 2× baseline, p99 ≤ 3s absolute, no worker crash.`,
                  `Per-run broker + harness logs are attached to each run as artifacts.`,
                  ``,
                  `Triage each comment by adding a quarantine label:`,
                  `\`quarantine:flake\` (transient, set a deadline) or`,
                  `\`quarantine:signal\` (real regression — blocks merges). See CONTRIBUTING.md.`,
                ].join('\n'),
                labels: [TRACKER_LABEL, 'weekly-soak', 'enterprise-item-1'],
              });
              issueNumber = created.data.number;
            }

            // Always append one comment per failure.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `### Failure — ${new Date().toISOString()}`,
                ``,
                `- **Commit:** ${context.sha}`,
                `- **Run:** ${runUrl}`,
                `- **kafka-soak:** ${soak}`,
                ``,
                `flake-vs-signal: TBD — set \`quarantine:flake\` or \`quarantine:signal\`.`,
              ].join('\n'),
            });
