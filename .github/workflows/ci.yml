name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Build first so @declaragent/core's dist/.d.ts exists before
      # sibling packages (source-*, testkit) typecheck against it.
      # Under moduleResolution: bundler + declaration-only core, the
      # types field resolves to dist/index.d.ts — missing when we
      # typecheck from a clean checkout. (Pre-existing CI bug, backlog #2.)
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # Drift guards — pre-push hook (.githooks/pre-push) is the primary
      # defence for these, but it's opt-in per clone (`bun run
      # hooks:install`). The CI check below is the safety net: it fails
      # the build when a push landed without running the extractor or
      # the formatter. See:
      #   - docs/POST_ENTERPRISE_BACKLOG.md #48, #49
      #   - .githooks/pre-push
      - name: Drift guard — docs-cli-extract (#48)
        run: |
          bun run scripts/docs-cli-extract.ts
          if ! git diff --quiet -- docs-site/docs/reference/cli.mdx; then
            echo "::error::docs-site/docs/reference/cli.mdx is out of date with packages/cli/src/index.tsx. Run \`bun run scripts/docs-cli-extract.ts\` locally (or \`bun run hooks:install\` once)."
            git --no-pager diff -- docs-site/docs/reference/cli.mdx | head -80
            exit 1
          fi

      - name: Docs-truth lint — commands, env vars, metrics, policy (DOCS_TRUTH_PLAN Wave 3)
        run: bun run lint:docs

      - name: Drift guard — sidebars.ts biome format (#49)
        run: |
          bun run biome format --write docs-site/sidebars.ts
          if ! git diff --quiet -- docs-site/sidebars.ts; then
            echo "::error::docs-site/sidebars.ts is not biome-formatted. Run \`bun run biome format --write docs-site/sidebars.ts\` locally (or \`bun run hooks:install\` once)."
            git --no-pager diff -- docs-site/sidebars.ts | head -40
            exit 1
          fi

      - name: Verify publishability (@declaragent/core)
        working-directory: packages/core
        run: npm publish --dry-run
