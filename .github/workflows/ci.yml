name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Build first so @declaragent/core's dist/.d.ts exists before
      # sibling packages (source-*, testkit) typecheck against it.
      # Under moduleResolution: bundler + declaration-only core, the
      # types field resolves to dist/index.d.ts — missing when we
      # typecheck from a clean checkout. (Pre-existing CI bug, backlog #2.)
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Verify publishability (@declaragent/core)
        working-directory: packages/core
        run: npm publish --dry-run
