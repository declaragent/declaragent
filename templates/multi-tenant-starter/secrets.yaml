version: 1
default: vault
providers:
  vault:
    type: vault
    address: ${env:VAULT_ADDRESS}
    auth:
      method: approle
      roleId: ${env:VAULT_ROLE_ID}
      secretId: ${env:VAULT_SECRET_ID}
    # TTL keeps cached secrets fresh; rotations surface within 5 minutes.
    defaultTtlMs: 300000
rotationMonitor:
  enabled: true
  checkIntervalMs: 3600000
  warnAfterDays: 60
  errorAfterDays: 120
