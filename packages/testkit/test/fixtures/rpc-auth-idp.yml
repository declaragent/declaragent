# OIDC IdP fixture for the RPC-auth integration test (Item #4).
#
# Uses navikt/mock-oauth2-server — a lightweight test IdP that DOES implement
# the `client_credentials` grant + a JWKS endpoint. (Dex v2.39 does NOT support
# client_credentials, so it can't mint the machine-to-machine token this test
# needs; the prior dex fixture is removed.)
#
# Usage (from the repo root):
#   docker compose -f packages/testkit/test/fixtures/rpc-auth-idp.yml up -d
#   RPC_AUTH_INTEGRATION=1 DEX_ISSUER=http://localhost:5557/default \
#     bun test packages/testkit/src/fleet-integration/rpc-auth.test.ts
#   docker compose -f packages/testkit/test/fixtures/rpc-auth-idp.yml down -v
#
# Endpoints: issuer http://localhost:5557/default, token .../token, jwks .../jwks.
# The token's `aud` is the requested scope ("echo") on a client_credentials grant.

services:
  idp:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: declaragent-rpc-auth-idp
    ports:
      - '5557:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O- http://localhost:8080/default/.well-known/openid-configuration >/dev/null',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
