version: '3.8'

# Single-node Redpanda, container-named so the broker-restart scenario
# can kill/start it by name. Wire matches the Kafka source adapter's
# fixture — feel free to point `KAFKA_BROKERS=localhost:19092` at this
# instance for the acceptance run.
#
# Usage (from the package root):
#   docker compose -f test/fixtures/docker-compose.yml up -d
#   LOAD_INTEGRATION=1 LOAD_BROKERS=localhost:19092 \
#     LOAD_CONTAINER=declaragent-testkit-redpanda \
#     bun test test/integration.test.ts
#   docker compose -f test/fixtures/docker-compose.yml down -v

services:
  redpanda:
    image: redpandadata/redpanda:v24.1.2
    container_name: declaragent-testkit-redpanda
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - '1G'
      - --reserve-memory
      - '0M'
      - --overprovisioned
      - --node-id
      - '0'
      - --check=false
      - --kafka-addr
      - 'PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092'
      - --advertise-kafka-addr
      - 'PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092'
      - --rpc-addr
      - '0.0.0.0:33145'
      - --advertise-rpc-addr
      - 'redpanda:33145'
    ports:
      - '19092:19092'
      - '9644:9644'
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -E "Healthy:.+true"']
      interval: 5s
      timeout: 3s
      retries: 20
