version: '3.8'

# Redpanda is a Kafka-wire-compatible broker that boots in one container
# (no ZooKeeper, no separate schema registry). Faster + lighter than
# bringing up Confluent for a single integration test.
#
# Usage (from the package root):
#   docker compose -f test/fixtures/docker-compose.yml up -d
#   KAFKA_INTEGRATION=1 KAFKA_BROKERS=localhost:19092 bun test test/integration.test.ts
#   docker compose -f test/fixtures/docker-compose.yml down -v

services:
  redpanda:
    image: redpandadata/redpanda:v24.1.2
    container_name: declaragent-kafka-redpanda
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - '512M'
      - --reserve-memory
      - '0M'
      - --overprovisioned
      - --node-id
      - '0'
      - --check=false
      - --kafka-addr
      - 'PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092'
      - --advertise-kafka-addr
      - 'PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092'
      - --rpc-addr
      - '0.0.0.0:33145'
      - --advertise-rpc-addr
      - 'redpanda:33145'
    ports:
      - '19092:19092'
      - '9644:9644'
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -E "Healthy:.+true"']
      interval: 5s
      timeout: 3s
      retries: 20
