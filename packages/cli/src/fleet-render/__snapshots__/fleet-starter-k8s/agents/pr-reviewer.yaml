apiVersion: v1
kind: ConfigMap
metadata:
  name: pr-reviewer-config
  namespace: fleet-starter
  labels:
    app.kubernetes.io/name: pr-reviewer
    app.kubernetes.io/part-of: fleet-starter
    app.kubernetes.io/managed-by: declaragent
    declaragent.io/agent-id: pr-reviewer
data:
  agent.yaml: |
    name: pr-reviewer
    model: claude-sonnet-4-6
    temperature: 0.2
    maxTokens: 4096
    subagentDepthCap: 1
    systemPrompt: |
      You review GitHub pull requests on demand. Every inbound turn is
      triggered by an `agent-rpc` request to your `review-pr` capability.
      The request payload is `{ prUrl: string, severity: "low"|"med"|"high" }` —
      the runtime validates it against `capabilities.yaml` before it reaches
      you, so you can trust the shape.

      Your job, per request:

      1. Fetch the PR diff from `prUrl`. (A future `@declaragent/plugin-github`
         release will provide `GitHubFetchDiff`; until then, treat the
         request as a dry run and return a stub response.)

      2. Skim the diff for:
         - Obvious bugs (null deref, off-by-one, swapped args).
         - Missing error handling.
         - New behavior without tests.
         - Public API changes without doc updates.

      3. Return a structured response:
           { verdict: "approve" | "request-changes" | "comment",
             findings: [{ file, line, severity, message }],
             summary: string }

      The runtime's default `ctx.respond` hook publishes whatever your
      assistant.final content is as `{ ok: true, data: <content> }`. If you
      want to return a structured object instead of text, call `ctx.respond`
      explicitly near the end of your turn.

      Hard rules:
      - Never APPROVE on your own. The caller decides — you only recommend.
      - Keep `findings` ≤ 8 entries; aggregate extras into `summary`.
      - Timeout: the request envelope's `deadline` is enforced by the
        requestor. If you can't respond in time, the pending-RPC registry
        times out — your response will be discarded as stale.
    tools:
      # Read-only review surface. The reviewer inspects the diff and returns a
      # recommendation over RPC (via ctx.respond) — it never needs Bash/Write/Edit.
      # Declaring the set explicitly keeps the runtime from exposing destructive
      # tools to an agent that processes untrusted PR payloads (WS1 enforcement).
      defaults:
        - Read
        - Glob
        - Grep
    skills:
      - skills/review-pr.md
    event-sources:
      - ./event-sources.yaml
  capabilities.yaml: |
    # Declares the capabilities this agent exposes to the rest of the
    # fleet. Producer-side `RequestAgent` callers consult this file via
    # `declaragent capabilities gen --peer pr-reviewer` to produce typed
    # `Request`/`Response` declarations + the runtime validates payloads
    # against these schemas on both sides (Enterprise Production Plan #11).
    version: 1
    agent: agent://pr-reviewer
    transports:
      - kind: memory
        topics:
          requests: agents.pr-reviewer.requests
          responses: agents.pr-reviewer.responses
      # Kafka variant — uncomment when running across processes:
      # - kind: kafka
      #   brokers: ["${env:KAFKA_BROKERS}"]
      #   topics:
      #     requests: agents.pr-reviewer.requests
      #     responses: agents.pr-reviewer.responses
    capabilities:
      - name: review-pr
        description: "Review a GitHub pull request and emit structured findings."
        timeoutMs: 60000
        idempotent: true
        since: "1.1.0"
        inputSchema:
          type: object
          properties:
            prUrl:
              type: string
              description: GitHub PR URL.
            severity:
              description: Reviewer's escalation floor — drop findings below this severity.
              enum: [low, med, high]
          required: [prUrl, severity]
          additionalProperties: false
        outputSchema:
          type: object
          properties:
            verdict:
              enum: [approve, request-changes, comment]
            findings:
              type: array
              items:
                type: object
                properties:
                  file: { type: string }
                  line: { type: integer }
                  severity:
                    enum: [blocker, major, minor, nit]
                  message: { type: string }
                required: [file, severity, message]
            summary: { type: string }
          required: [verdict, findings, summary]
  event-sources.yaml: |
    # PR-reviewer inbox: every `review-pr` request lands here. The adapter
    # decodes the envelope, verifies tenant scope (if multi-tenant), and
    # dispatches to the `review-pr` skill with `inputs.payload` carrying the
    # caller's payload.
    - type: agent-inbox
      config:
        id: inbox
        agentId: pr-reviewer
        # Swap memory → kafka below when running across processes:
        # requestsTopic: agents.pr-reviewer.requests
        # responsesTopic: agents.pr-reviewer.responses
      delivery:
        mode: at-least-once
        ackStrategy: after-dispatch
        maxRetries: 3
        retryBackoff:
          initialMs: 500
          maxMs: 10000
          jitter: true
        idempotency:
          strategy: transport-natural
          store: sqlite
          ttlMs: 900000
      limits:
        concurrency: 4
        maxInflight: 64
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-reviewer
  namespace: fleet-starter
  labels:
    app.kubernetes.io/name: pr-reviewer
    app.kubernetes.io/part-of: fleet-starter
    app.kubernetes.io/managed-by: declaragent
    declaragent.io/agent-id: pr-reviewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pr-reviewer
      app.kubernetes.io/part-of: fleet-starter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pr-reviewer
        app.kubernetes.io/part-of: fleet-starter
        app.kubernetes.io/managed-by: declaragent
        declaragent.io/agent-id: pr-reviewer
    spec:
      containers:
        - name: declaragent
          image: declaragent/agent:latest
          imagePullPolicy: IfNotPresent
          args:
            - up
            - -f
            - /etc/declaragent/agent.yaml
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          env:
            - name: DECLARAGENT_AGENT_ID
              value: pr-reviewer
            - name: DECLARAGENT_FLEET_NAME
              value: fleet-starter
            - name: DECLARAGENT_METRICS_PORT
              value: "9464"
            - name: DECLARAGENT_BIND_ADDRESS
              value: 0.0.0.0
          volumeMounts:
            - name: agent-config
              mountPath: /etc/declaragent
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: agent-config
          configMap:
            name: pr-reviewer-config
---
apiVersion: v1
kind: Service
metadata:
  name: pr-reviewer
  namespace: fleet-starter
  labels:
    app.kubernetes.io/name: pr-reviewer
    app.kubernetes.io/part-of: fleet-starter
    app.kubernetes.io/managed-by: declaragent
    declaragent.io/agent-id: pr-reviewer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pr-reviewer
    app.kubernetes.io/part-of: fleet-starter
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
