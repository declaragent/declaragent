{{- $agentId := "concierge" -}}
{{- $replicas := default .Values.replicas.default (index .Values.replicas $agentId) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: concierge-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "declaragent.agentLabels" (merge (dict "agentId" $agentId) .) | nindent 4 }}
data:
  agent.yaml: |
    name: concierge
    model: claude-haiku-4-5
    temperature: 0.3
    maxTokens: 1024
    systemPrompt: |
      You are a concierge that routes user requests to specialist agents
      over the agent-rpc bus. Your primary specialist is `agent://pr-reviewer`,
      which exposes a `review-pr` capability.

      When the user asks for a PR review:

      1. Use `RequestAgent` with:
           to: agent://pr-reviewer
           capability: review-pr
           payload: { prUrl: "<github-pr-url>" }
           timeoutMs: 60000
         Default mode is `sync` — the tool awaits the peer's response.

      2. If `status === "ok"`, format the `response` as a Markdown summary
         for the user.

      3. If `status === "timeout"` or `status === "error"`, apologize and
         offer to retry. DO NOT retry automatically — retries are the
         caller's explicit choice.

      Hard rules:
      - Never call `RequestAgent` with `mode: "fire-and-forget"` for a PR
        review — you need the result to answer the user.
      - Never reveal the correlationId to the user; it's an internal trace id.
      - Keep responses under 400 words.
    skills:
      - skills/delegate.md
    tools:
      defaults:
        - RequestAgent
    event-sources:
      - ./event-sources.yaml

  event-sources.yaml: |
    # Concierge's inbox. Subscribes to the responses topic so `RequestAgent`
    # (sync mode) can match incoming responses against its pending-RPC registry.
    - type: agent-inbox
      config:
        id: inbox
        agentId: concierge
        # Default topics are `agents.<agentId>.requests` + `.responses`.
      delivery:
        mode: at-least-once
        ackStrategy: after-dispatch
        maxRetries: 3
        retryBackoff:
          initialMs: 500
          maxMs: 10000
          jitter: true
      limits:
        concurrency: 8
        maxInflight: 256

{{- if .Values.configSplit.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: concierge-sources-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "declaragent.agentLabels" (merge (dict "agentId" $agentId) .) | nindent 4 }}
    declaragent.io/config-section: sources
data:
  SOURCES_YAML: |
    - ./event-sources.yaml
{{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concierge
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "declaragent.agentLabels" (merge (dict "agentId" $agentId) .) | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      {{- include "declaragent.agentSelectorLabels" (merge (dict "agentId" $agentId) .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "declaragent.agentLabels" (merge (dict "agentId" $agentId) .) | nindent 8 }}
    spec:
      containers:
        - name: declaragent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # WS6 - foreground up (no -d): the detached child exits, leaving PID 1
          # to exit 0 (CrashLoopBackOff). Foreground keeps PID 1 alive.
          args:
            - up
            - -f
            - /etc/declaragent/agent.yaml
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
          env:
            - name: DECLARAGENT_AGENT_ID
              value: concierge
            - name: DECLARAGENT_FLEET_NAME
              value: {{ include "declaragent.name" . | quote }}
            # WS6 — foreground up defaults the listener OFF; set it so the pod
            # serves /metrics + /healthz + /readyz for the probes.
            - name: DECLARAGENT_METRICS_PORT
              value: "{{ .Values.metricsPort }}"
            # WS6 — bind all interfaces so the kubelet reaches the probes via the
            # pod IP (default 127.0.0.1 → probes unreachable). Requires a
            # controlPlane.auth block per the WS3 fail-closed rule.
            - name: DECLARAGENT_BIND_ADDRESS
              value: "0.0.0.0"
          {{- if .Values.configSplit.enabled }}
          envFrom:
            - configMapRef:
                name: concierge-sources-config
          {{- if gt (len .Values.secrets) 0 }}
            - secretRef:
                name: {{ include "declaragent.fullname" . }}-secrets
          {{- end }}
          {{- else if gt (len .Values.secrets) 0 }}
          envFrom:
            - secretRef:
                name: {{ include "declaragent.fullname" . }}-secrets
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readyProbePath }}
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.healthProbePath }}
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: agent-config
              mountPath: /etc/declaragent
              readOnly: true
      volumes:
        - name: agent-config
          configMap:
            name: concierge-config
---
apiVersion: v1
kind: Service
metadata:
  name: concierge
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "declaragent.agentLabels" (merge (dict "agentId" $agentId) .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "declaragent.agentSelectorLabels" (merge (dict "agentId" $agentId) .) | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metricsPort }}
      targetPort: metrics
      protocol: TCP
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: concierge
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "declaragent.agentLabels" (merge (dict "agentId" "concierge") .) | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "declaragent.agentSelectorLabels" (merge (dict "agentId" "concierge") .) | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
