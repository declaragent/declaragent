apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleet-starter-dev
resources:
  - ../../base
commonLabels:
  declaragent.io/environment: dev
patches:
  - target:
      kind: Deployment
      name: concierge
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: concierge
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: declaragent
                resources:
                  limits:
                    cpu: 500m
                    memory: 512Mi
  - target:
      kind: Deployment
      name: pr-reviewer
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pr-reviewer
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: declaragent
                resources:
                  limits:
                    cpu: 500m
                    memory: 512Mi
commonAnnotations:
  declaragent.io/fleet: fleet-starter
  declaragent.io/environment: dev
